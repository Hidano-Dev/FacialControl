# FacialControl CI - Large テスト（手動 / 夜間）
#
# Large は実機ビルドや外部システム接続を含むテスト（docs/testing.md）。PR ごとには回さず、
# workflow_dispatch と夜間スケジュールで EditMode / PlayMode の -testCategory Large を実行する。
# REC → Timeline 往復検証の全シナリオの現状調査（HID-316）がここで回り、差分レポートを
# test-results/rec-timeline-equivalence/ に書く（成果物 large-test-results に含める）。
#
# 実行環境は ci.yml と同じ Linux セルフホストランナー（ラベル linux-unity）。
name: CI (Large)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # 毎日 03:00 JST

concurrency:
  group: ci-large
  cancel-in-progress: false

env:
  # Unity は 6000.3.19f1 に固定する（AGENTS.md）。他バージョンで起動すると ProjectVersion.txt が
  # 書き換わり全リインポートが走るため、composite action 側で ProjectVersion.txt と突き合わせる
  UNITY_VERSION: 6000.3.19f1
  UNITY_PROJECT_PATH: FacialControl
  TEST_RESULTS_DIR: test-results
  LARGE_CATEGORY: Large

jobs:
  large-tests:
    name: Large テスト（EditMode + PlayMode）
    runs-on: [self-hosted, linux-unity]
    timeout-minutes: 90
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          clean: false
      - name: 作業ツリーの掃除（Library は保持）
        run: git clean -ffdx -e "${{ env.UNITY_PROJECT_PATH }}/Library"

      - name: Large テスト実行（EditMode, -testCategory Large）
        uses: ./.github/actions/run-unity-tests
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          project-path: ${{ env.UNITY_PROJECT_PATH }}
          test-platform: EditMode
          test-category: ${{ env.LARGE_CATEGORY }}
          results-name: large-editmode

      - name: Large テスト実行（PlayMode, -testCategory Large）
        if: always()
        uses: ./.github/actions/run-unity-tests
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          project-path: ${{ env.UNITY_PROJECT_PATH }}
          test-platform: PlayMode
          test-category: ${{ env.LARGE_CATEGORY }}
          results-name: large-playmode

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-test-results
          path: |
            ${{ env.TEST_RESULTS_DIR }}/large-editmode.xml
            ${{ env.TEST_RESULTS_DIR }}/large-editmode.log
            ${{ env.TEST_RESULTS_DIR }}/large-playmode.xml
            ${{ env.TEST_RESULTS_DIR }}/large-playmode.log
            ${{ env.TEST_RESULTS_DIR }}/rec-timeline-equivalence/
          if-no-files-found: warn
