# FacialControl CI - パッケージバリデーション / テストサイズ別（Small / Medium）テスト自動実行
#
# テストは Google の Test size に従って Category で分類されている（docs/testing.md）。
#   - Small : EditMode、PR ごとに実行（push / pull_request すべて）
#   - Medium: EditMode + PlayMode、マージ前ゲート（pull_request と main への push）
#   - Large : 手動 / 夜間（.github/workflows/ci-large.yml）
# サイズ未宣言テストは test-size-check ジョブ（静的）と Small ジョブ内の
# TestSizeDeclarationTests（reflection）の両方で検出する。
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  UNITY_PROJECT_PATH: FacialControl
  TEST_RESULTS_DIR: test-results
  PACKAGE_PATH: FacialControl/Packages/com.hidano.facialcontrol
  LIPSYNC_EDITMODE_TEST_ASSEMBLY: Hidano.FacialControl.LipSync.Tests.EditMode
  LIPSYNC_PLAYMODE_TEST_ASSEMBLY: Hidano.FacialControl.LipSync.Tests.PlayMode
  SMALL_CATEGORY: Small
  MEDIUM_CATEGORY: Medium

jobs:
  package-validation:
    name: パッケージバリデーション
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: パッケージバリデーション実行
        run: |
          & "./scripts/validate-package.ps1" -PackagePath "${{ env.PACKAGE_PATH }}"
        shell: pwsh

  test-size-check:
    name: テストサイズ静的チェック
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: サイズ宣言・Small 禁止 API・Small アセンブリ参照の検査
        run: |
          & "./scripts/check-test-sizes.ps1" -PackagesPath "${{ env.UNITY_PROJECT_PATH }}/Packages"
        shell: pwsh

  small-tests:
    needs: [package-validation, test-size-check]
    name: Small テスト（EditMode, PR ごと）
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: テスト結果ディレクトリ作成
        run: |
          if (-Not (Test-Path "${{ env.TEST_RESULTS_DIR }}")) {
            New-Item -ItemType Directory -Path "${{ env.TEST_RESULTS_DIR }}"
          }
        shell: pwsh

      - name: Small テスト実行（EditMode, -testCategory Small）
        run: |
          & "$env:UNITY_PATH/Unity.exe" `
            -batchmode `
            -nographics `
            -projectPath "${{ env.UNITY_PROJECT_PATH }}" `
            -runTests `
            -testPlatform EditMode `
            -testCategory "${{ env.SMALL_CATEGORY }}" `
            -testResults "${{ env.TEST_RESULTS_DIR }}/small-editmode.xml"
        shell: pwsh

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-test-results
          path: ${{ env.TEST_RESULTS_DIR }}/small-editmode.xml

  medium-tests:
    needs: [package-validation, test-size-check]
    name: Medium テスト（EditMode + PlayMode, マージ前）
    # マージ前ゲート: PR と main への push で実行（feature ブランチへの push では Small のみ）
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: テスト結果ディレクトリ作成
        run: |
          if (-Not (Test-Path "${{ env.TEST_RESULTS_DIR }}")) {
            New-Item -ItemType Directory -Path "${{ env.TEST_RESULTS_DIR }}"
          }
        shell: pwsh

      - name: Medium テスト実行（EditMode, -testCategory Medium）
        run: |
          & "$env:UNITY_PATH/Unity.exe" `
            -batchmode `
            -nographics `
            -projectPath "${{ env.UNITY_PROJECT_PATH }}" `
            -runTests `
            -testPlatform EditMode `
            -testCategory "${{ env.MEDIUM_CATEGORY }}" `
            -testResults "${{ env.TEST_RESULTS_DIR }}/medium-editmode.xml"
        shell: pwsh

      - name: Medium テスト実行（PlayMode, -testCategory Medium）
        if: always()
        run: |
          & "$env:UNITY_PATH/Unity.exe" `
            -batchmode `
            -nographics `
            -projectPath "${{ env.UNITY_PROJECT_PATH }}" `
            -runTests `
            -testPlatform PlayMode `
            -testCategory "${{ env.MEDIUM_CATEGORY }}" `
            -testResults "${{ env.TEST_RESULTS_DIR }}/medium-playmode.xml"
        shell: pwsh

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-test-results
          path: |
            ${{ env.TEST_RESULTS_DIR }}/medium-editmode.xml
            ${{ env.TEST_RESULTS_DIR }}/medium-playmode.xml

  lipsync-small-tests:
    needs: [package-validation, test-size-check]
    name: uLipSync Small テスト（EditMode, PR ごと）
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: テスト結果ディレクトリ作成
        run: |
          if (-Not (Test-Path "${{ env.TEST_RESULTS_DIR }}")) {
            New-Item -ItemType Directory -Path "${{ env.TEST_RESULTS_DIR }}"
          }
        shell: pwsh

      - name: uLipSync Small テスト実行（EditMode, -testCategory Small）
        run: |
          $testResultsDir = (Resolve-Path "${{ env.TEST_RESULTS_DIR }}").Path
          $testResultsPath = Join-Path $testResultsDir "lipsync-small-editmode.xml"
          & "$env:UNITY_PATH/Unity.exe" `
            -batchmode `
            -nographics `
            -projectPath "${{ env.UNITY_PROJECT_PATH }}" `
            -runTests `
            -testPlatform EditMode `
            -assemblyNames "${{ env.LIPSYNC_EDITMODE_TEST_ASSEMBLY }}" `
            -testCategory "${{ env.SMALL_CATEGORY }}" `
            -testResults "$testResultsPath"
        shell: pwsh

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lipsync-small-test-results
          path: ${{ env.TEST_RESULTS_DIR }}/lipsync-small-editmode.xml
          if-no-files-found: error

  lipsync-medium-tests:
    needs: [package-validation, test-size-check]
    name: uLipSync Medium テスト（EditMode + PlayMode, マージ前）
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: テスト結果ディレクトリ作成
        run: |
          if (-Not (Test-Path "${{ env.TEST_RESULTS_DIR }}")) {
            New-Item -ItemType Directory -Path "${{ env.TEST_RESULTS_DIR }}"
          }
        shell: pwsh

      - name: uLipSync Medium テスト実行（EditMode, -testCategory Medium）
        run: |
          $testResultsDir = (Resolve-Path "${{ env.TEST_RESULTS_DIR }}").Path
          $testResultsPath = Join-Path $testResultsDir "lipsync-medium-editmode.xml"
          & "$env:UNITY_PATH/Unity.exe" `
            -batchmode `
            -nographics `
            -projectPath "${{ env.UNITY_PROJECT_PATH }}" `
            -runTests `
            -testPlatform EditMode `
            -assemblyNames "${{ env.LIPSYNC_EDITMODE_TEST_ASSEMBLY }}" `
            -testCategory "${{ env.MEDIUM_CATEGORY }}" `
            -testResults "$testResultsPath"
        shell: pwsh

      - name: uLipSync Medium テスト実行（PlayMode, -testCategory Medium）
        if: always()
        run: |
          $testResultsDir = (Resolve-Path "${{ env.TEST_RESULTS_DIR }}").Path
          $testResultsPath = Join-Path $testResultsDir "lipsync-medium-playmode.xml"
          & "$env:UNITY_PATH/Unity.exe" `
            -batchmode `
            -nographics `
            -projectPath "${{ env.UNITY_PROJECT_PATH }}" `
            -runTests `
            -testPlatform PlayMode `
            -assemblyNames "${{ env.LIPSYNC_PLAYMODE_TEST_ASSEMBLY }}" `
            -testCategory "${{ env.MEDIUM_CATEGORY }}" `
            -testResults "$testResultsPath"
        shell: pwsh

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lipsync-medium-test-results
          path: |
            ${{ env.TEST_RESULTS_DIR }}/lipsync-medium-editmode.xml
            ${{ env.TEST_RESULTS_DIR }}/lipsync-medium-playmode.xml
          if-no-files-found: error
